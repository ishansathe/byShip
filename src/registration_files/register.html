<!DOCTYPE html>
<html>
    <head>
        <title>ByShip Registration</title>
        <link rel="stylesheet" href="register.css">
    </head>
    <body>
        Separate accounts are needed for buyers and sellers.
        <form action="/await_confirm" method="post">
            <legend>Register.</legend>
            <label for="fullname">Enter Full Name</label>
            <input type="text" name="fullname" id="fullname" required>

            <label for="username">Enter username</label>
            <input type="text" name="username" id="username" required>

            <label for="email">Enter Email</label>
            <input type="email" name="email" id="email" required>

            <label for="password">Enter password</label>
            <input type="password" name="password" id="password" required>

            <label for="contact">Enter contact number</label>
            <input type="number" name="contact" id="contact" required>

            <label for="user_type">Type of User:</label>
            <select name="user_type" id="user_type" required>
                <option value="buyer">buyer</option>
                <option value="seller">seller</option>
            </select>

            <!-- <button type="submit">Submit</button> -->
             <input type="submit" value="Submit">
        </form>

        <!-- Script is kept at the end so that elements can be altered after they are already loaded. -->
        <script src="preset_type.js"></script>

        <div style="text-align: center; margin: 2rem;">
            Already registered?
            <button onclick="window.location.href='/login'">Login</button>
        </div>
        
    </body>
</html>
